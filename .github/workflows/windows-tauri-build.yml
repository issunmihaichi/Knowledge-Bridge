name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project Graph workspace packages
        run: pnpm --filter @graphif/serializer --filter @graphif/data-structures --filter @graphif/shapes run build

      - name: Build NSIS installer
        run: pnpm --filter @knowledge-bridge/app tauri:build
        env:
          # This CI job publishes an installable development artifact. The
          # updater public key remains in the app configuration, but release
          # signing requires a TAURI_SIGNING_PRIVATE_KEY GitHub secret.
          TAURI_BUILD_ARGS: --bundles nsis --no-sign

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Knowledge-Bridge-windows-nsis
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Capture desktop startup preview
        shell: powershell
        run: ./.github/scripts/capture-windows-startup.ps1

      - name: Upload desktop startup preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Knowledge-Bridge-startup-preview
          path: artifacts/knowledge-bridge-startup.png
          if-no-files-found: warn
          retention-days: 30
