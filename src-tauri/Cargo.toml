[package]
name = "knowledge-bridge"
version = "1.0.0"
description = "Local-first knowledge bridge workspace"
authors = ["Knowledge Bridge contributors"]
edition = "2021"

[lib]
name = "knowledge_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
